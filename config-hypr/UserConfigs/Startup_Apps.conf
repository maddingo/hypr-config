# Commands and Apps to be executed at launch

# JetBrains Toolbox is XWayland and positions its popup where it thinks its tray
# icon is -- which under Hyprland is a stale guess, often off-screen. Window
# rules cannot correct it (the X11 USPosition hint is applied after the rule and
# wins), so this listener repositions the window at the mouse pointer as it
# opens. Details in the script header.
exec-once = $UserScripts/JetBrainsToolboxAtCursor.sh --listener

