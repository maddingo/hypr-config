# For window rules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


# Layer rules now belong in UserConfigs/LayerRules.conf

# TAG: Edge tooltips -- Edge renders tooltips as real toplevels with an empty
# class AND an empty title (Chrome uses anchored popups instead). On the event
# socket they appear as `openwindow>>ADDR,2,,` with sizes like 52x28 / 163x28,
# all from the Edge pid. Tiled, each one entered the dwindle layout on the
# browser's own workspace and closed a moment later, forcing two reflows in
# quick succession -- that reflow was the "flickering". Each also stole focus.
#
# The ^$ matcher is the risky part of this fix: it catches ANY empty-class,
# empty-title toplevel, not just Edge's. It is isolated on this one line so it
# can be narrowed in a single place if something else ever trips it.
windowrule = match:class ^$, match:title ^$, tag +edge_tooltip

# Keep tooltips out of the tiling layout so it never reflows. A Wayland toplevel
# cannot position itself, so once floated Hyprland places it dead centre of the
# monitor; cursor_x/cursor_y put it back under the pointer.
#
# Syntax notes for Hyprland 0.56.2, all established by testing -- the rule
# parser accepts bad values silently, so these fail quietly rather than erroring:
#   - windowrulev2's `move cursor <x> <y>` keyword no longer exists. `move` takes
#     a vec2 expression, hence cursor_x / cursor_y.
#   - Do NOT add `onscreen`. `move onscreen (expr) (expr)` is accepted but breaks
#     parsing and silently falls back to centring.
#   - `no_border` / `no_rounding` are rejected outright; the working field names
#     are `border_size 0` and `rounding 0`.
#
# Known limitation: without `onscreen` there is no edge clamping, so a tooltip
# raised within ~170px of a monitor's right edge can spill onto the neighbouring
# monitor. Cosmetic, given tooltips are ~28px tall.
windowrule = match:tag edge_tooltip, float on, no_initial_focus on, move (cursor_x+12) (cursor_y+20)
windowrule = match:tag edge_tooltip, no_anim on, no_dim on, no_shadow on, no_blur on, border_size 0, rounding 0

