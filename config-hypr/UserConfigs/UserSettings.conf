# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this

# ---- Layouts ----
# Moved here out of configs/SystemSettings.conf so updates cannot clobber them.
# This file is sourced after configs/SystemSettings.conf (see hyprland.conf), so these
# win even if an update reinstates the upstream blocks there.
# Per-workspace layout selection lives in workspaces.conf; ChangeLayout.sh switches at
# runtime. The active layout for new workspaces is general:layout in SystemSettings.conf.

dwindle {
  #pseudotile = false    # Not supported 0.55+
  preserve_split = true
  smart_resizing = true
  use_active_for_splits = true
  smart_split = false
  default_split_ratio = 1.0
  split_bias = 0
  precise_mouse_move = false
  special_scale_factor = 0.8
}

master {
  new_status = slave
  new_on_top = false
  new_on_active = none
  orientation = left
  mfact = 0.55
  slave_count_for_center_master = 2
  center_master_fallback = left
  smart_resizing = true
  drop_at_cursor = true
  always_keep_position = false
}

scrolling {
  # Default width of new windows (0.1 - 1.0)
  column_width = 0.90
  # If only one window is open, should it span the whole screen?
  fullscreen_on_one_column = true
  # Direction: right, left, up, or down
  direction = right
  # Center the focused window automatically
  follow_focus = true
}

monocle {
  # I can't find any settings on the wiki
}


# ---- Focus under fullscreen ----
# Re-enables the setting commit e54499e reverted. Sourced after configs/SystemSettings.conf
# (hyprland.conf lines 34 vs 39), so this wins over the 0 there without touching the upstream
# file -- which also means the stale "Was 1, which broke fullscreen" comment still sitting in
# SystemSettings.conf no longer describes reality. Read this block, not that one.
#
# Why it was set to 0: with 1, Outlook web's blank throwaway toplevel (no class, no title, ~10ms
# life) seized the fullscreen state when it took focus, then closed and carried fullscreen out
# with it, leaving the browser windowed.
#
# Why 1 is safe now: that takeover happens *on focus*, and the same commit added
#   windowrule = match:tag edge_tooltip, float on, no_initial_focus on, ...
# which denies focus to exactly that empty-class/empty-title toplevel. No focus, no takeover.
# Both changes landed in one commit, so 1 was never retested with the rule in place -- it was
# reverted on the strength of a problem the rule had already solved.
#
# Verified 2026-09-24, both halves: launching a window while a fullscreen one is up brings it to
# the front (previously it sat there mapped:1 visible:0, stranded behind -- the OAS Buddy case),
# and Outlook web now holds fullscreen while its tooltips spawn.
#
# If Outlook web ever drops out of fullscreen again, delete this block; the 0 in
# configs/SystemSettings.conf resumes with nothing else to undo.
misc {
  on_focus_under_fullscreen = 1
}
