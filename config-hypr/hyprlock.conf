# /* ---- 💫 https://github.com/LinuxBeginnings 💫 ---- */  #
# Hyprlock config — minimal / Swiss layout
# Clock + date + input field, centered. Colors driven by wallust.
# Previous stock layout preserved at hyprlock.conf.bak

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    # NOTE: use only 1 path
	#path = screenshot   # screenshot of your desktop
	#path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_modified # by wallpaper effects
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current # current wallpaper

    color = rgb(0,0,0) # color will be rendered initially until path is available

    # Heavier blur + dimmer than stock, so ExtraLight type stays readable
    # over any wallpaper. See https://wiki.hyprland.org/Configuring/Variables/#blur
    blur_size = 4
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.0000
    brightness = 0.5500
    vibrancy = 0.1000
    vibrancy_darkness = 0.0
}

# TIME — primary element, brightest color for contrast
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"    # 24h
#     text = cmd[update:1000] echo "$(date +"%I:%M %p")" # AM/PM option
    color = $foreground
    font_size = 150
    font_family = Inter Display ExtraLight
    position = 0, 90
    halign = center
    valign = center
}

# DATE — secondary, muted
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A, %-d %B')"
    color = $color8
    font_size = 26
    font_family = Inter Light
    position = 0, -30
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 306, 50
    outline_thickness = 1
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $color8
    inner_color = rgba(0, 0, 0, 0.15)
    capslock_color = rgb(255,255,255)
    font_color = $foreground
    fade_on_empty = false
    font_family = Inter Light
    placeholder_text =
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
}

