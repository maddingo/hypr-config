# Hand-maintained. Do NOT re-run nwg-displays against this file -- see the note
# in monitors.conf. Workspaces are bound by EDID description, not connector name.
#
#   V906YWA0 = middle screen   -> 1, 4, 7, 10
#   V907BZ2P = right screen    -> 2, 5, 8
#   eDP-1    = laptop panel    -> 3, 6, 9

workspace = 1,monitor:desc:Lenovo Group Limited P27h-20 V906YWA0,default:true,layout:master
workspace = 2,monitor:desc:Lenovo Group Limited P27h-20 V907BZ2P,default:true
workspace = 3,monitor:eDP-1,default:true,layout:scrolling
workspace = 4,monitor:desc:Lenovo Group Limited P27h-20 V906YWA0
workspace = 5,monitor:desc:Lenovo Group Limited P27h-20 V907BZ2P
workspace = 6,monitor:eDP-1
workspace = 7,monitor:desc:Lenovo Group Limited P27h-20 V906YWA0
workspace = 8,monitor:desc:Lenovo Group Limited P27h-20 V907BZ2P
workspace = 9,monitor:eDP-1
workspace = 10,monitor:desc:Lenovo Group Limited P27h-20 V906YWA0
