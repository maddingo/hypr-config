# Hand-maintained -- do NOT run nwg-displays (see CLAUDE.md). It rewrites this file
# using connector names, which are MST port numbers here (DP-8/DP-9/DP-10/DP-12 so far)
# and drift across reboots and redocks. Externals are matched on EDID description; the
# two panels are the same model, so the serial in the desc is the only disambiguator.

# Exactly three workspaces, one per monitor. There are deliberately no rules for 4-10:
# the keys that would create them are unbound in UserConfigs/UserKeybinds.conf.

workspace = 1, monitor:desc:Lenovo Group Limited LEN P27h-10 0x30583854, default:true, layout:scrolling # middle
workspace = 2, monitor:desc:Lenovo Group Limited LEN P27h-10 0x30463657, default:true, layout:dwindle   # right
workspace = 3, monitor:eDP-1, default:true, layout:dwindle                                              # laptop
