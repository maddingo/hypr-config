# Hand-maintained. Do NOT re-run nwg-displays against this file -- it writes
# connector names (DP-8 / DP-10), which are not stable across reboots on this
# machine. Monitors are matched by EDID description instead.
#
# The two externals are the same model, so the serial is what disambiguates them:
#   V906YWA0 = middle screen
#   V907BZ2P = right screen
# eDP-1 has an empty description, so it is matched by connector name (stable for
# an internal panel).
#
# Get the description strings with:
#   hyprctl monitors -j | jq -r '.[] | "\(.name)\t\(.description)"'

monitor = eDP-1,1920x1200@120.0,274x0,1.0
monitor = desc:Lenovo Group Limited P27h-20 V906YWA0,2560x1440@59.95,2194x0,1
monitor = desc:Lenovo Group Limited P27h-20 V907BZ2P,2560x1440@59.95,4754x0,1

# Fallback for any unknown monitor, so a new/borrowed screen still lights up.
monitor = ,preferred,auto,1
